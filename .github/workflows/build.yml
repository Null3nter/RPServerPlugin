name: Build & Release Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload plugin JAR (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: RPServerPlugin
          path: target/RPServerPlugin-*.jar

      # Only create a real GitHub Release on pushes to main (not on PRs)
      - name: Create / Update continuous "latest" Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body_path: CHANGELOG.md
          files: |
            target/RPServerPlugin-*.jar
            CHANGELOG.md
          prerelease: true
          make_latest: true
          generate_release_notes: false

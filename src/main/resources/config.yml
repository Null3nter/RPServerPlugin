# RPServerPlugin Configuration
# Fill in your Discord bot details below.

# Discord Bot Token (from Discord Developer Portal)
bot-token: "YOUR_DISCORD_BOT_TOKEN"

# Your Discord Server (Guild) ID
guild-id: "YOUR_DISCORD_SERVER_ID"

# List of Discord Role IDs that are allowed to verify / join
# Players must have at least ONE of these roles to successfully /verify
allowed-role-ids: []

# Staff role IDs – members with these roles can use Discord staff commands
# (/manual-link, close tickets, etc.)
staff-role-ids: []

# Discord Webhook URL for in-game chat synchronization
chat-webhook-url: "YOUR_DISCORD_WEBHOOK_URL"

# Audit / staff log webhook – receives admin actions, tickets, force-verifies, etc.
audit-webhook-url: "YOUR_AUDIT_WEBHOOK_URL"

# Optional: Discord category ID where ticket channels are created
# Leave blank to create channels at the top level of the server
ticket-category-id: ""

# Optional: Channel ID where ticket transcripts are posted when a ticket is closed
ticket-transcript-channel-id: ""

# Players who can join without Discord linking (UUID or username)
# Can also be managed in-game with /staff add|remove
manual-bypass-players: []

# How long (in seconds) a generated link code remains valid
code-expiry-seconds: 300

# Cooldown (in seconds) after adding or removing a plus-one before you can change it again
# Default: 3600 = 1 hour
plusone-cooldown-seconds: 3600

# Message shown to restricted (unlinked) players
restriction-message: "&cYou must link your Discord account to play. Use &e/link &cthen verify in Discord with the code."

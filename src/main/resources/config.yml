# RPServerPlugin Configuration

# Discord Bot Token (from Discord Developer Portal)
bot-token: "YOUR_DISCORD_BOT_TOKEN"

# Your Discord Server (Guild) ID – the full RP Hub
guild-id: "YOUR_DISCORD_SERVER_ID"

# Discord user ID of the guild owner (required for hierarchy commands)
owner-id: "DISCORD_GUILD_OWNER_ID"

# Co-owner Discord user IDs (managed via /management-owner)
co-owner-ids: []

# Bot-admin Discord role IDs (managed via /management-owner-admin)
bot-admin-role-ids: []

# Staff Discord role IDs – can see/close all tickets (managed via /management-admin)
staff-role-ids: []

# Roles allowed to /verify and play on the SMP
allowed-role-ids: []

# In-game chat → Discord webhook
chat-webhook-url: "YOUR_CHAT_WEBHOOK_URL"

# Audit log webhook for all admin/management actions
audit-log-webhook-url: "YOUR_AUDIT_WEBHOOK_URL"

# ─── Dual Ticket System ───────────────────────────────────────────
# Two separate systems: PUBLIC (non-SMP) and SMP (verified members)

# Channel IDs where the ticket PANEL embeds are posted
# Use /ticket-panel public or /ticket-panel smp to post the buttons
ticket-panel-channel-public: ""
ticket-panel-channel-smp: ""

# Category IDs under which private ticket channels are created
ticket-category-public: ""
ticket-category-smp: ""

# Optional: channel where closed-ticket transcripts are posted
ticket-transcript-channel-id: ""

# Players who skip Discord linking (UUID or username)
manual-bypass-players: []

# Staff-linked accounts (UUID -> Discord ID) – managed by /stafflink
manual-staff-link-list: {}

# Link code lifetime in seconds
code-expiry-seconds: 300

# Cooldown after changing plus-one (seconds)
plusone-cooldown-seconds: 3600

# Message shown to restricted players
restriction-message: "&cYou must link your Discord account to play!"

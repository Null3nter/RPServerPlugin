name: RPServerPlugin
version: ${project.version}
main: com.rpserver.plugin.RPServerPlugin
api-version: '1.21'
author: Null3nter
description: Discord linking, role verification, plus-one, tickets, staff tools, chat sync
commands:
  link:
    description: Generate a temporary code to link your Minecraft account with Discord
    usage: /link
    permission: rpserver.link
  forceverify:
    description: Manually verify a player (admin only)
    usage: /forceverify <player>
    permission: rpserver.admin
  plusone:
    description: Invite one friend as your plus-one (verified players only)
    usage: /plusone [player|remove]
    permission: rpserver.plusone
  staff:
    description: Manage manual bypass / staff entries
    usage: /staff <add|remove|list> [player|UUID]
    permission: rpserver.admin
  ticket:
    description: Create or close a support ticket
    usage: /ticket <create|close> [reason]
    permission: rpserver.ticket
permissions:
  rpserver.link:
    description: Allows using the /link command
    default: true
  rpserver.plusone:
    description: Allows using the /plusone command
    default: true
  rpserver.ticket:
    description: Allows creating support tickets
    default: true
  rpserver.admin:
    description: Allows force-verifying players and staff management
    default: op

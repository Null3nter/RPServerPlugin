name: RPServerPlugin
version: ${project.version}
main: com.rpserver.plugin.RPServerPlugin
api-version: '1.21'
author: Null3nter
description: Discord linking, role verification, plus-one, tickets, hierarchy management, chat sync
commands:
  link:
    description: Generate a temporary code to link your Minecraft account with Discord
    usage: /link
    permission: rpserver.link
  forceverify:
    description: Manually verify a player (admin only)
    usage: /forceverify <player>
    permission: rpserver.admin
  plusone:
    description: Invite one friend as your plus-one
    usage: /plusone [player|remove]
    permission: rpserver.plusone
  staff:
    description: Manage manual bypass entries
    usage: /staff <add|remove|list> [player|UUID]
    permission: rpserver.admin
  stafflink:
    description: Instantly link a player to a Discord ID
    usage: /stafflink <player> <discord_id>
    permission: rpserver.admin
  ticket:
    description: Submit a support ticket to staff
    usage: /ticket <message>
    permission: rpserver.ticket
permissions:
  rpserver.link:
    description: Allows using the /link command
    default: true
  rpserver.plusone:
    description: Allows using the /plusone command
    default: true
  rpserver.ticket:
    description: Allows submitting support tickets
    default: true
  rpserver.admin:
    description: Admin commands (forceverify, staff, stafflink)
    default: op
